# The name of our workflow
name: Build
on: [push, pull_request]

jobs:  
  msvc:
    strategy:
      matrix:
        arch: [x86, amd64, amd64_arm64]

    env:
      # Indicates the location of the vcpkg as a Git submodule of the project repository.
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      SOLUTION_FILE_PATH: .
      BUILD_CONFIGURATION: Release
      buildDir: '${{ github.workspace }}/build'

    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    - uses: lukka/get-cmake@latest
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Restore from cache and install vcpkg
      uses: lukka/run-vcpkg@v6
      with:
        setupOnly: true
        vcpkgGitCommitId: 'a267ab118c09f56f3dae96c9a4b3410820ad2f0b'
        additionalCachedPaths: ${{ env.buildDir }}/vcpkg_installed
        appendedCacheKey: ${{ matrix.arch }}-${{ hashFiles( '**/vcpkg.json' ) }}

    - name: Run CMake with vcpkg.json manifest
      uses: lukka/run-cmake@v3
      with:
        useVcpkgToolchainFile: true
        buildWithCMake: true
        buildDirectory: ${{ env.buildDir }}
        cmakeAppendedArgs: '-GNinja'

    - uses: actions/upload-artifact@v2
      with:
        name: openvpn-gui ${{ matrix.arch }}
        path: '${{ env.buildDir }}/openvpn-gui.exe'

  mingw:
    strategy:
      fail-fast: false
      matrix:
        openssl_version: [1.1.1m, 3.0.1]
        target: [mingw64, mingw]
        include:
          - target: mingw64
            chost: x86_64-w64-mingw32
          - target: mingw
            chost: i686-w64-mingw32

    name: "gcc-mingw - ${{matrix.target}} - ossl${{ matrix.openssl_version }}"
    runs-on: ubuntu-20.04
    
    env:
      MAKEFLAGS: -j3
      CHOST: ${{ matrix.chost }}
      TARGET: ${{ matrix.target }}
      
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y mingw-w64 libtool automake autoconf
        
      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: openvpn-gui
        
      - name: autoconf
        run: autoreconf -fvi
        working-directory: openvpn-gui
      
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v2
        with:
          path: '~/mingw/'
          key: ${{ matrix.target }}-mingw-${{ matrix.openssl_version }}
          
      - name: Download mingw dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget -c -P download-cache/ "https://www.openssl.org/source/openssl-${{ matrix.openssl_version }}.tar.gz"
          tar zxf "download-cache/openssl-${{ matrix.openssl_version }}.tar.gz"

      - name: Configure OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./Configure --cross-compile-prefix=${CHOST}- shared ${{ matrix.target }} no-capieng --prefix="${HOME}/mingw/opt" --openssldir="${HOME}/mingw/opt" -static-libgcc
        working-directory: "./openssl-${{ matrix.openssl_version }}"

      - name: Build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: make
        working-directory: "./openssl-${{ matrix.openssl_version }}"

      - name: Install OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: make install
        working-directory: "./openssl-${{ matrix.openssl_version }}"
        
      - name: configure      
        run: PKG_CONFIG_PATH=${HOME}/mingw/opt/lib/pkgconfig ./configure --host=${CHOST} --enable-password-change=yes
        working-directory: openvpn-gui
        
      - name: make
        run: make
        working-directory: openvpn-gui
